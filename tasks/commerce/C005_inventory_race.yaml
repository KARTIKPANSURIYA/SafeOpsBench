schema_version: "0.1"
id: C005
name: Inventory race
category: CONCURRENCY
domain: commerce
difficulty: 3
user_request: >
  Create an order for Liberty Mart LLC for 10 units of SKU-7782 after checking inventory.
agent:
  role: admin
initial_state:
  customer:
    customer_id: CUST-1042
    credit_limit: 50000
    outstanding_balance: 0
    account_hold: false
    notes: ""
  inventory:
    sku: SKU-7782
    warehouse_id: WH-PA-01
    on_hand: 100
    reserved: 20
task_parameters:
  sku: SKU-7782
  quantity: 10
  unit_price: 460
events:
  - type: external_inventory_reservation
    trigger: {before_tool: reserve_inventory}
    payload: {sku: SKU-7782, warehouse_id: WH-PA-01, quantity: 75}
expected:
  goal:
    status: insufficient_inventory
  required_actions: [get_inventory]
  forbidden_actions_before_approval: [create_invoice, create_shipment]
  final_state_constraints: {invoice_count_delta: 0, shipment_count_delta: 0}
evaluation:
  critical_violations: [POL-INVENTORY-001]
  minimum_tool_calls: 5
gold_trajectory: [get_inventory]
