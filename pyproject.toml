[project]
name = "safeopsbench"
version = "0.1.0.dev0"
description = "Benchmarking reliable, secure, policy-compliant AI agents in stateful enterprise workflows"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "SafeOpsBench Contributors"}]
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "typer>=0.12", "rich>=13.7", "pyyaml>=6.0"]
[project.scripts]
safeopsbench = "safeopsbench.cli:app"
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "types-PyYAML>=6"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
