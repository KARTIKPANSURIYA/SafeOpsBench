name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy safeopsbench
      - run: uv run pytest --cov=safeopsbench --cov-report=term-missing
      - run: uv run safeopsbench validate-tasks
